<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scouted</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-screen visual novel. HUD strip, illustrated stage (venue art, character sprites, phone or game HUD, dialogue box), action panel below. Single dark Valor look. */
:root{
  color-scheme:dark;
  --bg:#080d22; --panel:#10183a; --panel2:#17214b; --line:#26326b; --line2:#334190;
  --text:#ecefff; --muted:#9ba5d6; --dim:#6a74a8;
  --blue:#3f8cff; --violet:#8b5cff; --violet2:#b49bff;
  --good:#38d39f; --warn:#ffb648; --bad:#ff6b7d;
  --display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--violet2);outline-offset:2px}
#app{position:relative;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}

/* HUD */
.hud{display:flex;align-items:center;gap:10px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:#0a0f28;z-index:5}
.hud .ch{font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.daychip{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.cycle{display:flex;gap:3px}
.cycle i{width:16px;height:6px;border-radius:3px;background:var(--panel2)}
.cycle i.on{background:var(--violet2)}
.venue{font-size:13px;color:var(--text);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.tag{font-family:var(--mono);font-size:11px;padding:3px 7px;border-radius:4px;letter-spacing:.04em;white-space:nowrap}
.tag.k{background:rgba(63,140,255,.16);color:#a9c9ff;border:1px solid rgba(63,140,255,.5)}
.tag.t{background:rgba(139,92,255,.18);color:var(--violet2);border:1px solid rgba(139,92,255,.55)}
.hbtn{background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:5px 10px;font-size:13px;cursor:pointer;white-space:nowrap}
.hbtn:hover{border-color:var(--violet)}
@media (max-width:700px){#hudTags,.daychip .cycle{display:none}.hud .ch{max-width:34vw}}

/* stage */
.stage{position:relative;overflow:hidden;background:#0a0f2a;min-height:200px;cursor:default}
.stage.tap{cursor:pointer}
.bg{position:absolute;inset:0;transition:opacity .5s}
.bg svg{width:100%;height:100%;display:block}
.tint{position:absolute;inset:0;pointer-events:none;transition:background .8s}
.tint.Morning{background:linear-gradient(180deg,rgba(255,190,120,.16),rgba(255,190,120,0) 60%)}
.tint.Day{background:transparent}
.tint.Evening{background:linear-gradient(180deg,rgba(139,92,255,.28),rgba(255,120,140,.08))}
.tint.Night{background:rgba(4,6,24,.42)}
.scrollx{animation:scrollx 9s linear infinite}
@keyframes scrollx{to{transform:translateX(-800px)}}
.cast{position:absolute;left:0;right:0;bottom:0;height:88%;display:flex;justify-content:center;align-items:flex-end;gap:clamp(0px,2vw,30px);pointer-events:none;padding-inline:4%}
.spr{position:relative;height:100%;max-height:520px;aspect-ratio:200/240;flex:0 1 auto;min-width:0;transition:filter .3s,transform .3s;filter:brightness(.55) saturate(.75);animation:enter .45s ease-out both}
.spr svg{width:100%;height:100%;display:block;animation:bob 3.6s ease-in-out infinite}
.spr:nth-child(2) svg{animation-delay:-1.2s}.spr:nth-child(3) svg{animation-delay:-2.1s}.spr:nth-child(4) svg{animation-delay:-.6s}
.spr.talk{filter:none;transform:translateY(-8px) scale(1.04);z-index:2}
.spr .eyes{animation:blink 4.8s infinite;transform-origin:100px 104px}
.spr:nth-child(2) .eyes{animation-delay:-1.7s}.spr:nth-child(3) .eyes{animation-delay:-3.1s}
.spr .m-open{opacity:0}
.spr.talk.typing .m-open{animation:talk .22s steps(1) infinite}
.spr.talk.typing .m-closed{animation:talk2 .22s steps(1) infinite}
.spr.leave{animation:leave .3s ease-in forwards}
@keyframes bob{50%{transform:translateY(4px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes talk{0%{opacity:1}50%{opacity:0}}
@keyframes talk2{0%{opacity:0}50%{opacity:1}}
@keyframes enter{from{opacity:0;transform:translateY(30px)}}
@keyframes leave{to{opacity:0;transform:translateY(30px)}}

/* dialogue box */
.dlg{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;width:min(820px,calc(100% - 24px));background:rgba(10,14,40,.93);border:1px solid var(--line2);border-radius:14px;padding:12px 16px 14px;box-shadow:0 14px 40px rgba(0,0,0,.5);z-index:3;min-height:76px}
.dlg .dn{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;display:flex;gap:8px;align-items:baseline}
.dlg .dn small{font-family:var(--body);text-transform:none;letter-spacing:0;color:var(--dim);font-weight:400;font-size:12px}
.dlg .dt{font-size:18px;line-height:1.45;min-height:1.45em}
.dlg.sys .dt{font-style:italic;color:#c9d0f2}
.dlg.tut{border-color:var(--violet);border-style:dashed}
.dlg.tut .dt{font-style:normal;color:var(--violet2);font-family:var(--mono);font-size:14px}
.dlg.you{border-color:var(--violet)}
.dlg .more{position:absolute;right:14px;bottom:8px;width:10px;height:10px;border-right:2px solid var(--violet2);border-bottom:2px solid var(--violet2);transform:rotate(45deg);animation:nudge 1s infinite;opacity:0}
.stage.tap .dlg .more{opacity:1}
@keyframes nudge{50%{transform:translateY(3px) rotate(45deg)}}

/* phone */
.phone{position:absolute;top:4%;bottom:4%;left:50%;transform:translateX(-50%);width:min(340px,86%);background:#0b1030;border:6px solid #1c2458;border-radius:34px;box-shadow:0 20px 60px rgba(0,0,0,.6);display:flex;flex-direction:column;overflow:hidden;z-index:3;animation:enter .35s ease-out both}
.ph-top{display:flex;align-items:center;gap:10px;padding:16px 14px 10px;border-bottom:1px solid var(--line);background:#10173f}
.ph-top .av{width:34px;height:34px;border-radius:50%;overflow:hidden;background:var(--panel2);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:13px;color:#0b1026;flex:none}
.ph-top .av svg{width:100%;height:100%}
.ph-top b{font-family:var(--display);font-size:15px;display:block;line-height:1.1}
.ph-top small{color:var(--good);font-size:11px}
.ph-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth}
.bub{max-width:82%;padding:8px 12px;border-radius:16px;font-size:15px;line-height:1.35;animation:pop .25s ease-out both}
.bub.in{align-self:flex-start;background:var(--panel2);border-bottom-left-radius:4px}
.bub.out{align-self:flex-end;background:linear-gradient(135deg,var(--violet),#6a45e6);color:#fff;border-bottom-right-radius:4px}
.bub.out.silent{background:transparent;border:1px dashed var(--line2);color:var(--muted);font-style:italic}
.bub.note{align-self:center;background:transparent;color:var(--muted);font-style:italic;font-size:13px;text-align:center;max-width:95%}
.bub.note.tut{color:var(--violet2);font-style:normal;font-family:var(--mono);font-size:12px;border:1px dashed rgba(139,92,255,.6)}
.typing-dots{align-self:flex-start;background:var(--panel2);border-radius:16px;padding:10px 14px;display:flex;gap:4px}
.typing-dots i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:dot 1s infinite}
.typing-dots i:nth-child(2){animation-delay:.15s}.typing-dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{opacity:.25;transform:translateY(-2px)}}
@keyframes pop{from{opacity:0;transform:scale(.9)}}

/* game HUD */
.ghud{position:absolute;inset:0;pointer-events:none;z-index:2}
.score{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(6,9,30,.85);border:1px solid var(--line2);border-radius:10px;padding:6px 12px;font-family:var(--display);font-weight:700;letter-spacing:.06em;white-space:nowrap}
.score .t1{color:var(--violet2);font-size:13px}.score .t2{color:#ff9fae;font-size:13px}
.score b{font-size:24px;min-width:28px;text-align:center}
.score .rd{font-family:var(--mono);font-size:10px;color:var(--muted);padding:2px 6px;border:1px solid var(--line2);border-radius:4px}
.team{position:absolute;left:12px;top:64px;display:flex;flex-direction:column;gap:6px}
.tm{display:flex;align-items:center;gap:8px;background:rgba(6,9,30,.8);border:1px solid var(--line);border-radius:10px;padding:4px 10px 4px 4px;transition:border-color .2s,box-shadow .2s;font-family:var(--display);font-size:13px;font-weight:600}
.tm .hd{width:34px;height:34px;border-radius:8px;overflow:hidden;background:var(--panel2);display:grid;place-items:center;font-size:12px}
.tm .hd svg{width:100%;height:100%}
.tm .mic{display:flex;gap:2px;align-items:flex-end;height:12px}
.tm .mic i{width:3px;height:4px;background:var(--dim);border-radius:1px}
.tm.live{border-color:var(--good);box-shadow:0 0 0 2px rgba(56,211,159,.25)}
.tm.live .mic i{background:var(--good);animation:eq .4s infinite alternate}
.tm.live .mic i:nth-child(2){animation-delay:.1s}.tm.live .mic i:nth-child(3){animation-delay:.2s}
@keyframes eq{to{height:12px}}
.minimap{position:absolute;right:12px;top:64px;width:110px;height:110px;border-radius:12px;background:rgba(6,9,30,.8);border:1px solid var(--line2);overflow:hidden}
.minimap svg{width:100%;height:100%}
@media (max-width:700px){.minimap{display:none}.team{top:56px}.tm{font-size:0;padding-right:4px;gap:4px}.tm .hd{width:28px;height:28px}.score b{font-size:18px}.score .t1,.score .t2{font-size:11px}}
.igchat{position:absolute;left:12px;bottom:110px;width:min(440px,calc(100% - 24px));background:rgba(4,6,22,.82);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;z-index:3;font-size:14px;display:flex;flex-direction:column;gap:4px}
.igchat .h{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--warn)}
.igchat .l b{color:#ff9fae}.igchat .l.me b{color:var(--violet2)}

/* town map */
.mapwrap{position:absolute;inset:0;z-index:2;background:#0a1030;animation:enter .35s both}
.townmap{width:100%;height:100%;display:block}
.pin{cursor:default}
.pin.on{cursor:pointer}
.pin .ring{animation:ring 1.6s ease-out infinite;transform-origin:0 0}
.pin.on:hover>g,.pin.sel>g{filter:brightness(1.3)}
.pin:not(.on){opacity:.45}
@keyframes ring{from{transform:scale(.7);opacity:1}to{transform:scale(1.25);opacity:0}}
.mapnote{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:3;background:rgba(6,9,30,.88);border:1px solid var(--line2);border-radius:999px;padding:6px 14px;font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}

/* bottom panel */
.panel{border-top:1px solid var(--line);background:#0d1432;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-height:52vh;overflow-y:auto}
.panel-in{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.cont{align-self:stretch;background:transparent;border:1px solid var(--line2);border-radius:10px;padding:11px;cursor:pointer;font-family:var(--mono);font-size:13px;color:var(--muted);letter-spacing:.06em}
.cont:hover{border-color:var(--violet);color:var(--text)}
.q{font-family:var(--display);font-weight:600;font-size:15px;color:var(--violet2);letter-spacing:.03em}
.timer{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--violet),var(--blue));transform-origin:left}
.timer.low i{background:var(--bad)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:620px){.opts{grid-template-columns:1fr}}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:15px;line-height:1.35;transition:border-color .15s,transform .1s}
.opt:hover,.opt.hl{border-color:var(--violet);transform:translateY(-1px)}
.opt kbd{font-family:var(--mono);font-size:11px;background:var(--bg);border:1px solid var(--line2);border-radius:4px;padding:1px 6px;color:var(--muted);margin-top:1px}
.opt .vt{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--violet2);margin-bottom:2px}
.opt.q2{border-color:var(--good)}.opt.q1{border-color:var(--warn)}.opt.q0{border-color:var(--bad)}
.opt[disabled]{cursor:default;transform:none}
.opt.dim{opacity:.45}
.gm-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.gm-title{font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:14px}
.gm-sit{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;color:var(--muted)}
.slots{display:flex;gap:6px;flex-wrap:wrap}
.slot{font-family:var(--mono);font-size:12px;padding:5px 9px;border-radius:6px;border:1px solid var(--line2);color:var(--dim)}
.slot.on{border-color:var(--violet);color:var(--violet2);background:rgba(139,92,255,.14)}
.slot.done{border-color:var(--good);color:var(--good)}
.slot-label{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.slot-label .big{font-family:var(--display);font-size:26px;font-weight:700;color:var(--violet2);line-height:1}
.slot-label .nm{font-family:var(--display);font-weight:600;font-size:16px}
.slot-label .hint{color:var(--muted);font-size:14px}
.fb{display:flex;flex-direction:column;gap:8px}
.fb-row{display:grid;grid-template-columns:auto 1fr;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px}
.fb-row .k{font-family:var(--display);font-weight:700;color:var(--violet2);min-width:22px}
.fb-row .w{color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.dot.q2{background:var(--good)}.dot.q1{background:var(--warn)}.dot.q0{background:var(--bad)}
.scoretxt{font-family:var(--mono);font-size:13px;color:var(--muted)}
.scoretxt b{color:var(--text);font-size:16px}
.callcard{position:relative;background:linear-gradient(135deg,rgba(61,214,176,.12),rgba(139,92,255,.12));border:1px solid rgba(61,214,176,.6);border-radius:12px;padding:16px;font-size:19px;font-family:var(--display);font-weight:600;text-align:center;min-height:80px;display:grid;place-items:center}
.callcard.gone{color:var(--dim);font-family:var(--mono);font-size:13px;font-weight:500;border-style:dashed}
.ping{position:absolute;right:10px;top:-14px;background:var(--warn);color:#1a1300;font-family:var(--body);font-size:13px;font-weight:700;padding:5px 10px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.4);animation:shake .5s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* toasts */
.toasts{position:fixed;top:calc(56px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;z-index:40;pointer-events:none;width:min(320px,calc(100% - 24px))}
.toast{display:flex;align-items:center;gap:10px;background:rgba(16,24,58,.97);border:1px solid var(--line2);border-left:4px solid var(--violet);border-radius:10px;padding:8px 12px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.45);animation:tin .35s ease-out both}
.toast .av{width:28px;height:28px;border-radius:7px;overflow:hidden;display:grid;place-items:center;background:var(--panel2);flex:none}
.toast .av svg{width:100%;height:100%}
.toast.out{animation:tout .4s ease-in forwards}
@keyframes tin{from{opacity:0;transform:translateX(20px)}}
@keyframes tout{to{opacity:0;transform:translateX(20px)}}

/* overlays */
.ov{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ov-in{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.hero{position:relative;height:clamp(200px,38vh,340px);border-radius:18px;overflow:hidden;border:1px solid var(--line2)}
.hero .bg svg{width:100%;height:100%}
.hero .cast{height:92%}
.hero .spr{filter:none}
.hero .logo-wrap{position:absolute;left:20px;top:16px;z-index:3}
.brand{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--violet2);text-transform:uppercase}
h1.logo{font-family:var(--display);font-weight:700;font-size:clamp(52px,12vw,110px);line-height:.9;letter-spacing:.02em;margin:6px 0 0;text-transform:uppercase;background:linear-gradient(180deg,#fff 30%,var(--violet2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(0,0,0,.6))}
.lede{font-size:18px;color:var(--muted);max-width:62ch;margin:0}
.lede b{color:var(--text)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{background:linear-gradient(135deg,var(--violet),#6a45e6);border:0;border-radius:10px;padding:12px 20px;font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--text)}
.btn.ghost:hover{border-color:var(--violet)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.field input{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:11px 14px;font:inherit;font-size:18px;color:var(--text);width:min(320px,100%)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;padding:7px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--violet);color:#fff}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.chcard{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.chcard:hover{border-color:var(--violet)}
.chcard .n{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.chcard .ttl{font-family:var(--display);font-weight:700;font-size:17px}
.chcard .s{font-size:13px;color:var(--muted)}
.sec-h{font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:14px;color:var(--muted);margin:0}
.toolcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.tc{border-radius:14px;padding:16px;border:1px solid;display:flex;flex-direction:column;gap:10px}
.tc.k{border-color:rgba(63,140,255,.6);background:linear-gradient(160deg,rgba(63,140,255,.16),rgba(63,140,255,.04))}
.tc.t{border-color:rgba(139,92,255,.65);background:linear-gradient(160deg,rgba(139,92,255,.2),rgba(139,92,255,.04))}
.tc .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.tc.k .lbl{color:#a9c9ff}.tc.t .lbl{color:var(--violet2)}
.tc h3{font-family:var(--display);font-size:22px;margin:0;line-height:1.1;text-wrap:balance}
.tc p{margin:0;color:var(--muted);font-size:15px}
.steps{display:flex;flex-direction:column;gap:6px}
.steps div{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:baseline;font-size:15px}
.steps b{font-family:var(--display);font-size:20px;color:var(--violet2)}
.steps span em{color:var(--muted);font-style:normal}
.picks{display:flex;flex-direction:column;gap:8px}
.pick{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.pick .a{font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--line2);color:var(--muted)}
.chip.up{border-color:rgba(56,211,159,.6);color:var(--good)}
.chip.dn{border-color:rgba(255,107,125,.6);color:var(--bad)}
.reflect{border:1px dashed var(--line2);border-radius:12px;padding:14px 16px}
.reflect p{margin:6px 0 0;font-size:17px}
.bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.bar{display:flex;flex-direction:column;gap:5px}
.bar .top{display:flex;justify-content:space-between;font-size:14px}
.bar .top span:last-child{font-family:var(--mono);color:var(--muted);font-size:12px}
.bar .tr{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:4px}
.relgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.rel{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.rel .av{width:52px;height:52px;border-radius:12px;overflow:hidden;background:var(--panel2)}
.rel .av svg{width:100%;height:100%}
.rel .nm{font-family:var(--display);font-weight:600}
.rel .st{font-size:13px;color:var(--muted)}
.pips{display:flex;gap:3px;margin-top:4px}
.pips i{width:14px;height:5px;border-radius:2px;background:var(--panel2)}
.pips i.on{background:var(--violet2)}
.pips i.neg{background:var(--bad)}
.ending h2.end-t{font-family:var(--display);font-size:clamp(34px,7vw,56px);line-height:1;margin:4px 0 0;text-transform:uppercase}
.ending p{font-size:17px;margin:0;max-width:65ch}
.ending .ep{display:flex;flex-direction:column;gap:10px}
.notes table{width:100%;border-collapse:collapse;font-size:14px}
.notes th,.notes td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.notes th{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.tbl{overflow-x:auto}
.notes ul{margin:0;padding-left:20px;color:var(--muted)}
.notes li{margin:4px 0}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);z-index:35;background:var(--panel);border-left:1px solid var(--line2);padding-block:calc(18px + env(safe-area-inset-top,0px)) 18px;padding-left:18px;padding-right:max(18px,env(safe-area-inset-right,0px));overflow-y:auto;display:flex;flex-direction:column;gap:12px;box-shadow:-20px 0 40px rgba(0,0,0,.4)}
.drawer .rel{background:var(--panel2)}
.logl{display:flex;flex-direction:column;gap:2px;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
.logl b{font-family:var(--display);font-size:12px;letter-spacing:.05em;text-transform:uppercase}
.logl.sys{color:var(--muted);font-style:italic}
.logl.sc{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;border:0;padding-top:12px}
@media (max-width:700px){.stage .cast{top:3%;bottom:auto;height:62%}.dlg .dt{font-size:16px}.dlg{padding:10px 12px 12px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>body{margin:0}</style>

<body>

    </div>

    <div class="phone" id="phone" hidden><div class="ph-top"><div class="av" id="phAv"></div><div><b id="phName"></b><small>online</small></div></div><div class="ph-msgs" id="phMsgs"></div></div>
    <div class="mapwrap" id="mapwrap" hidden></div>

</div>

<script>
/* ===== Scouted v2 art: original SVG sprites, venue backgrounds and town map ===== */
function shade(hex,amt){
  let c=hex.replace('#','');if(c.length===3)c=c.split('').map(x=>x+x).join('');
  let r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16);
  const f=v=>Math.max(0,Math.min(255,Math.round(amt<0?v*(1+amt):v+(255-v)*amt)));
  return '#'+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,'0')).join('');
}
const LOOK={
  coach:{skin:'#8d5a3b',hair:'bun',hc:'#1d1420',top:'#3b2d6b',acc:'#b49bff',type:'blazer',lanyard:1},

  theo:{skin:'#6b4630',hair:'curly',hc:'#140e0b',top:'#2a2f7a',acc:'#3dd6b0',type:'jersey',glasses:1,headset:1},
  dee:{skin:'#e8b98f',hair:'pony',hc:'#5a3a22',top:'#f5c451',acc:'#fff1c2',type:'hoodie'},
  sam:{skin:'#b98463',hair:'beanie',hc:'#7d88b8',top:'#3d4670',acc:'#a9b4d6',type:'hoodie'},
  host:{skin:'#d9a07a',hair:'bob',hc:'#7b5cd6',top:'#c7d2fe',acc:'#8b5cff',type:'blazer',headset:1},
  kai:{skin:'#f2d0b5',hair:'messy',hc:'#e2c25a',top:'#24306b',acc:'#ffffff',type:'polo'},
  ryder:{skin:'#e6b48c',hair:'slick',hc:'#2b2b2b',top:'#ff9f43',acc:'#1a1a1a',type:'jacket'}
};
const HAIR={
  short:c=>`<path d="M57 100 C52 58 76 46 100 46 C126 46 150 58 143 100 C140 80 128 68 112 66 C100 74 80 72 70 70 C62 78 58 88 57 100Z" fill="${c}"/>`,
  bun:c=>`<path d="M57 98 C54 56 146 56 143 98 C136 74 118 64 100 64 C82 64 64 74 57 98Z" fill="${c}"/>`,
  spiky:c=>`<path d="M57 100 L52 64 L68 70 L68 44 L86 58 L98 34 L110 56 L130 42 L130 66 L148 60 L143 100 C136 78 118 70 100 70 C82 70 64 78 57 100Z" fill="${c}"/>`,
  curly:c=>`<g fill="${c}"><circle cx="66" cy="80" r="15"/><circle cx="78" cy="62" r="16"/><circle cx="100" cy="54" r="18"/><circle cx="122" cy="62" r="16"/><circle cx="134" cy="80" r="15"/><circle cx="60" cy="98" r="9"/><circle cx="140" cy="98" r="9"/><circle cx="88" cy="70" r="12"/><circle cx="112" cy="70" r="12"/></g>`,
  pony:c=>`<path d="M57 100 C52 56 148 56 143 100 C140 76 124 64 104 62 C96 70 76 74 62 80 C60 86 58 92 57 100Z" fill="${c}"/>`,
  beanie:c=>`<path d="M54 92 C54 38 146 38 146 92Z" fill="${c}"/><rect x="51" y="80" width="98" height="17" rx="8" fill="${shade(c,-.25)}"/><circle cx="100" cy="36" r="8" fill="${shade(c,.2)}"/>`,

function sprite(k,opt){
  opt=opt||{};const L=LOOK[k];if(!L)return '';
  const sk=L.skin,hc=L.hc,top=L.top,acc=L.acc,dk=shade(top,-.3),skd=shade(sk,-.14);
  let back='';
  if(L.hair==='pony')back=`<path d="M136 80 C170 92 168 150 150 166 C146 140 140 120 132 104Z" fill="${hc}"/>`;
  if(L.hair==='bob')back=`<path d="M52 92 C52 50 148 50 148 92 L152 150 C130 160 70 160 48 150Z" fill="${hc}"/>`;
  if(L.hair==='bun')back=`<circle cx="100" cy="44" r="18" fill="${hc}"/>`;
  let body=`<path d="M16 240 C18 190 58 166 100 166 C142 166 182 190 184 240Z" fill="${top}"/>`;
  if(L.type==='jersey')body+=`<path d="M28 200 C60 180 140 180 172 200" stroke="${acc}" stroke-width="7" fill="none"/><path d="M84 166 L100 188 L116 166Z" fill="${dk}"/><circle cx="134" cy="214" r="10" fill="none" stroke="${acc}" stroke-width="3"/><path d="M134 207 l2.4 4.6 5 .8 -3.6 3.6 .8 5 -4.6 -2.4 -4.6 2.4 .8 -5 -3.6 -3.6 5 -.8z" fill="${acc}"/>`;
  if(L.type==='hoodie')body+=`<path d="M60 172 C70 150 130 150 140 172 C126 186 74 186 60 172Z" fill="${dk}"/><path d="M90 182 L88 214 M110 182 L112 214" stroke="${acc}" stroke-width="3" stroke-linecap="round"/>`;
  if(L.type==='blazer'||L.type==='jacket')body+=`<path d="M86 166 L100 200 L114 166Z" fill="${L.type==='jacket'?'#1a1a1a':'#eef0ff'}"/><path d="M78 166 L100 222 L122 166 L136 172 L104 240 L96 240 L64 172Z" fill="${dk}" opacity=".85"/>`;
  if(L.type==='polo')body+=`<path d="M80 166 L100 180 L120 166 L120 180 L100 192 L80 180Z" fill="#eef0ff"/><path d="M100 192 L100 214" stroke="#eef0ff" stroke-width="3"/>`;
  if(L.lanyard)body+=`<path d="M88 172 L100 222 L112 172" stroke="${acc}" stroke-width="3" fill="none"/><rect x="91" y="220" width="18" height="22" rx="3" fill="#eef0ff"/><rect x="95" y="226" width="10" height="3" fill="${acc}"/>`;
  const face=`<path d="M76 90 Q84 85 92 89 M108 89 Q116 85 124 90" stroke="${shade(hc,-.3)}" stroke-width="4" stroke-linecap="round" fill="none"/>
   <g class="eyes"><ellipse cx="84" cy="104" rx="5" ry="6" fill="#1a1430"/><ellipse cx="116" cy="104" rx="5" ry="6" fill="#1a1430"/><circle cx="86" cy="102" r="1.7" fill="#fff"/><circle cx="118" cy="102" r="1.7" fill="#fff"/></g>
   <path d="M100 108 Q95 118 101 120" stroke="${shade(sk,-.25)}" stroke-width="3" fill="none" stroke-linecap="round"/>
   <ellipse cx="74" cy="120" rx="7" ry="4" fill="#ff7a8a" opacity=".18"/><ellipse cx="126" cy="120" rx="7" ry="4" fill="#ff7a8a" opacity=".18"/>
   <path class="m-closed" d="M89 130 Q100 138 111 130" stroke="#5a2034" stroke-width="3.5" fill="none" stroke-linecap="round"/>
   <ellipse class="m-open" cx="100" cy="132" rx="8" ry="6" fill="#4a1426"/>`;
  const glasses=L.glasses?`<g fill="rgba(255,255,255,.08)" stroke="#e9ecff" stroke-width="3"><rect x="71" y="93" width="26" height="21" rx="8"/><rect x="103" y="93" width="26" height="21" rx="8"/><path d="M97 102 L103 102"/></g>`:'';
  const hs=(L.headset&&opt.headset!==false)?`<path d="M56 104 C54 38 146 38 144 104" stroke="#151a40" stroke-width="8" fill="none"/><rect x="45" y="93" width="17" height="29" rx="7" fill="#151a40" stroke="${acc}" stroke-width="2"/><rect x="138" y="93" width="17" height="29" rx="7" fill="#151a40" stroke="${acc}" stroke-width="2"/><path d="M54 120 C56 140 74 142 86 137" stroke="#151a40" stroke-width="4" fill="none"/><circle cx="87" cy="137" r="4" fill="${acc}"/>`:'';
  const vb=opt.head?'38 30 124 124':'0 0 200 240';
  return `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${back}<rect x="87" y="136" width="26" height="40" rx="11" fill="${skd}"/>${body}<ellipse cx="58" cy="106" rx="7" ry="10" fill="${skd}"/><ellipse cx="142" cy="106" rx="7" ry="10" fill="${skd}"/><ellipse cx="100" cy="102" rx="42" ry="48" fill="${sk}"/>${HAIR[L.hair](hc)}${face}${glasses}${hs}</svg>`;
}

/* ---- venue backgrounds, 800x450 ---- */
const stars=(n,w,h,seed)=>{let s='',x=seed;for(let i=0;i<n;i++){x=(x*9301+49297)%233280;const a=x/233280;x=(x*9301+49297)%233280;const b=x/233280;s+=`<circle cx="${(a*w).toFixed(0)}" cy="${(b*h).toFixed(0)}" r="${(a*1.6+.4).toFixed(1)}" fill="#e9ecff" opacity="${(b*.6+.3).toFixed(2)}"/>`;}return s;};

school:()=>`<svg viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="bsS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fb2ff"/><stop offset="1" stop-color="#c7dbff"/></linearGradient></defs>
<rect width="800" height="450" fill="#27347a"/><rect y="370" width="800" height="80" fill="#1a2357"/>
<g><rect x="30" y="60" width="150" height="190" rx="4" fill="url(#bsS)"/><circle cx="80" cy="210" r="40" fill="#2f8f7a"/><circle cx="130" cy="220" r="34" fill="#3aa58a"/><rect x="30" y="60" width="150" height="190" rx="4" fill="none" stroke="#e9ecff" stroke-width="6"/><path d="M105 60 V250 M30 155 H180" stroke="#e9ecff" stroke-width="4"/></g>

<text x="270" y="112" font-family="Chakra Petch, sans-serif" font-size="24" font-weight="700" fill="#2a2f7a">GROUP PROJECT</text>
<path d="M272 140 H520 M272 170 H480 M272 200 H540" stroke="#3f8cff" stroke-width="5" stroke-linecap="round" opacity=".7"/><path d="M500 225 l20 -20 l10 10z" fill="#8b5cff"/>
<circle cx="660" cy="96" r="30" fill="#e3e8ff" stroke="#9aa6dc" stroke-width="5"/><path d="M660 96 V76 M660 96 L674 104" stroke="#2a2f7a" stroke-width="4" stroke-linecap="round"/>

<g fill="#3a3470"><rect x="60" y="340" width="220" height="16" rx="4"/><rect x="330" y="350" width="240" height="16" rx="4"/></g><g fill="#2a2556"><rect x="80" y="356" width="12" height="60"/><rect x="250" y="356" width="12" height="60"/><rect x="350" y="366" width="12" height="60"/><rect x="540" y="366" width="12" height="60"/></g></svg>`,
library:()=>{let books='';const cols=['#8b5cff','#3f8cff','#3dd6b0','#f5c451','#ff8a7a','#b49bff','#5aa2ff'];let x=0;
  for(let sh=0;sh<3;sh++){for(let row=0;row<4;row++){let bx=60+sh*240;while(bx<260+sh*240){const w=10+((bx*7+row*13)%12);const h=44+((bx+row*5)%18);books+=`<rect x="${bx}" y="${100+row*66+(60-h)}" width="${w}" height="${h}" fill="${cols[(x++)%cols.length]}" opacity=".85"/>`;bx+=w+3;}}}

  <g fill="#3a2f5f">${[0,1,2].map(i=>`<rect x="${50+i*240}" y="80" width="220" height="290" rx="4"/>`).join('')}</g>${books}<g fill="#4b3d78">${[0,1,2].map(i=>[0,1,2,3,4].map(r=>`<rect x="${50+i*240}" y="${96+r*66}" width="220" height="6"/>`).join('')).join('')}</g>
  <rect x="200" y="330" width="400" height="18" rx="5" fill="#3a2f8f"/><path d="M520 330 L540 280 L560 280 L548 330Z" fill="#f5c451" opacity=".9"/><ellipse cx="550" cy="300" rx="80" ry="40" fill="#f5c451" opacity=".12"/></svg>`;},

function townMap(open){
  const roads=`<g fill="none" stroke-linecap="round"><path d="M80 640 H1500 M620 120 V820 M1060 120 V820 M280 640 C280 420 450 250 620 250 H1360 M1060 600 C1200 600 1360 480 1360 300" stroke="#1f2862" stroke-width="40"/>
  <path d="M80 640 H1500 M620 120 V820 M1060 120 V820 M280 640 C280 420 450 250 620 250 H1360 M1060 600 C1200 600 1360 480 1360 300" stroke="#3b4690" stroke-width="3" stroke-dasharray="18 18"/></g>`;
  let blocks='';const B=[[120,120,200,160],[380,90,160,110],[720,90,180,90],[1140,80,140,110],[1420,420,140,180],[120,720,260,120],[720,700,240,140],[1180,700,260,140],[420,380,140,160],[760,360,200,170],[1180,380,120,140]];
  B.forEach(([x,y,w,h],i)=>{blocks+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="18" fill="#121a46"/>`;for(let k=0;k<4;k++)blocks+=`<rect x="${x+16+k*(w-32)/4}" y="${y+16}" width="${(w-32)/4-10}" height="${h-32-((i+k)%3)*14}" rx="4" fill="#1a2358"/>`;});
  const river=`<path d="M0 470 C200 430 360 520 520 470 S820 380 960 440 S1300 520 1600 460" stroke="#1d3a8a" stroke-width="54" fill="none" opacity=".75"/><path d="M0 470 C200 430 360 520 520 470 S820 380 960 440 S1300 520 1600 460" stroke="#3f8cff" stroke-width="4" fill="none" opacity=".4" stroke-dasharray="6 22"/>`;
  const park=`<path d="M780 400 C840 360 940 370 960 420 C980 480 900 520 830 510 C770 500 740 450 780 400Z" fill="#143a44"/><g fill="#1f5a5e"><circle cx="820" cy="430" r="18"/><circle cx="870" cy="410" r="22"/><circle cx="910" cy="450" r="18"/><circle cx="850" cy="470" r="16"/></g>`;
  let pins='';
  for(const k in PINS){const p=PINS[k];const on=open.includes(k);
    pins+=`<g class="pin${on?' on':''}" data-v="${k}" transform="translate(${p.x} ${p.y})" ${on?'tabindex="0" role="button" aria-label="'+p.n+'"':''}>
     ${on?'<circle class="ring" r="80" fill="none" stroke="#b49bff" stroke-width="4"/>':''}<circle r="90" fill="transparent"/>${ICON[k]}
     <g transform="translate(0 78)"><rect x="${-p.n.length*9-18}" y="-22" width="${p.n.length*18+36}" height="40" rx="20" fill="${on?'#8b5cff':'#141c4a'}" stroke="${on?'#e9ecff':'#334190'}" stroke-width="2"/><text y="6" text-anchor="middle" font-family="Chakra Petch, sans-serif" font-size="24" font-weight="700" fill="${on?'#fff':'#6a74a8'}">${p.n}</text></g></g>`;}
  return `<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" class="townmap"><rect width="1600" height="900" fill="#0a1030"/>${river}${roads}${blocks}${park}${pins}</svg>`;
}

const TIMES=['Morning','Day','Evening','Night'];
let SCN={v:null,mode:'room',bgV:null,cast:[],noAdd:false,contact:null};
function setBg(v){if(SCN.bgV===v)return;SCN.bgV=v;$('bg').innerHTML=(BG[v]||BG.home)();}

function renderCast(list){
  const box=$('cast');const keep=new Set(list);

  list.forEach((k,i)=>{let s=box.querySelector('[data-k="'+k+'"]');if(!s){s=el('div','spr');s.dataset.k=k;s.innerHTML=sprite(k);}box.append(s);});
  SCN.cast=list.slice();
}
function setTalk(k){[...$('cast').children].forEach(c=>{c.classList.toggle('talk',c.dataset.k===k);});
  [...$('team').children].forEach(c=>c.classList.toggle('live',c.dataset.k===k));}
function buildTeam(){const t=$('team');t.replaceChildren();
  [['you',S.name],['mako','Mako'],['jules','Jules'],['theo','Theo']].forEach(([k,n])=>{const c=el('div','tm');c.dataset.k=k;

   const mic=el('span','mic');mic.append(el('i'),el('i'),el('i'));c.append(h,el('span',null,n),mic);t.append(c);});}
function setScene(n){
  const v=n.v;SCN.v=v;SCN.noAdd=!!n.noAdd;

  if(mode==='phone'){if(SCN.contact!==n.contact){$('phMsgs').replaceChildren();}SCN.contact=n.contact;$('phName').textContent=n.contact||'Messages';
    const ck=Object.keys(CAST).find(k=>CAST[k].n===n.contact)||(n.contact==='Unknown number'||n.contact==='Ryder'?'ryder':null);
    const av=$('phAv');av.innerHTML='';if(ck&&LOOK[ck])av.innerHTML=head(ck);else{av.textContent='?';av.style.background='var(--panel2)';}
    dlg.hidden=true;}else SCN.contact=null;

/* ---------- lines ---------- */
let typing=null;
function typeInto(target,text,onDone){
  if(typing){clearInterval(typing.id);}
  const spr=$('cast').querySelector('.spr.talk');if(spr)spr.classList.add('typing');
  const fin=()=>{if(!typing)return;clearInterval(typing.id);target.textContent=text;typing=null;if(spr)spr.classList.remove('typing');onDone&&onDone();};
  if(reduced||SET.text==='instant'){target.textContent=text;if(spr)spr.classList.remove('typing');onDone&&onDone();return;}
  let i=0;target.textContent='';const step=SET.text==='fast'?4:2;
  typing={fin,id:setInterval(()=>{i+=step;target.textContent=text.slice(0,i);if(i>=text.length)fin();},16)};
}
function showDlg(who,text,kind){

  typeInto($('dText'),text);
}
function addLine(n,quiet){
  const x=nm(n.x);const silent=n.s==='you'&&/^\(.*\)$/.test(x);
  logPush({s:n.s,x});

  if(mode==='phone'){
    const box=$('phMsgs');
    const add=()=>{const b=el('div','bub '+(n.s==='sys'?'note'+(n.tut?' tut':''):n.s==='you'?'out'+(silent?' silent':''):'in'),x);box.append(b);box.scrollTop=box.scrollHeight;};
    if(n.s!=='sys'&&n.s!=='you'&&!reduced){const d=el('div','typing-dots');d.append(el('i'),el('i'),el('i'));box.append(d);box.scrollTop=box.scrollHeight;
      typing={fin:()=>{if(!typing)return;clearTimeout(typing.id);d.remove();typing=null;add();},id:setTimeout(()=>typing&&typing.fin(),520)};}
    else add();

  }
  if(mode==='allchat'&&CAST[n.s]&&CAST[n.s].remote&&n.s!=='ryder'){const l=el('div','l');l.append(el('b',null,'[ALL] '+CAST[n.s].n+': '),document.createTextNode(x));$('igMsgs').append(l);dlg.hidden=true;setTalk(null);return;}

    let list=SCN.cast.slice();if(list.length>=4)list.shift();list.push(n.s);renderCast(list);}

/* ---------- runner ---------- */
let Q=[],keyHandler=null,timerId=null,tapHandler=null;
function clearPanel(){panel.replaceChildren();keyHandler=null;tapHandler=null;stage.classList.remove('tap');if(timerId){cancelAnimationFrame(timerId);timerId=null;}}
function step(){
  clearPanel();
  if(!Q.length)return;
  const n=Q.shift();
  if(n.t==='scene'){setScene(n);return step();}
  if(n.t==='score'){setScore(n);return step();}
  if(n.s){addLine(n);return waitTap();}
  if(n.t==='choice')return showChoice(n);
  if(n.t==='map')return showMap(n);
  if(n.t==='if'){Q.unshift(...((n.c(S)?n.y:n.n)||[]));return step();}
  if(n.t==='dyn'){Q.unshift(...(n.f(S)||[]));return step();}
  if(n.t==='fx'){applyFx(n.fx,true);return step();}
  if(n.t==='do'){n.f(S);return step();}
  if(n.t==='game')return (n.kind==='mirror'?gameMirror:gameBuild)(n);
  if(n.t==='end')return showRecap();
  if(n.t==='final')return showFinal();
}
function advance(){if(typing){typing.fin();return;}step();}
function waitTap(){
  const b=el('button','cont','Continue   (space)');b.type='button';b.onclick=advance;panel.append(b);
  stage.classList.add('tap');tapHandler=advance;
  keyHandler=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();advance();}};
}
stage.addEventListener('click',e=>{if(e.target.closest('.pin'))return;if(tapHandler)tapHandler();});
function applyFx(fx,announce){
  for(const k in fx){S.v[k]=(S.v[k]||0)+fx[k];}
  if(!announce)return;
  Object.entries(fx).filter(([k,v])=>RELS.includes(k)&&v>0).forEach(([k])=>toast(k,CAST[k].n+' liked that.'));
}
function startTimer(sec,onDone){
  const bar=el('div','timer');const i=el('i');bar.append(i);
  const total=sec*tmul()*1000;const t0=performance.now();
  const tick=now=>{const f=Math.max(0,1-(now-t0)/total);i.style.transform='scaleX('+f+')';bar.classList.toggle('low',f<.3);
    if(f<=0){timerId=null;onDone();return;}timerId=requestAnimationFrame(tick);};
  timerId=requestAnimationFrame(tick);return bar;
}
function choose(n,o,silent){
  const say=o.say?nm(o.say):nm(o.x);
  applyFx(o.fx);

/* ---------- builder minigame ---------- */
function gameBuild(n){
  if(typing)typing.fin();
  const d=n.data;const picks=[];let idx=0,finished=false;
  const hd=el('div','gm-head');hd.append(el('div','gm-title',d.title));const tl=el('span','scoretxt');hd.append(tl);
  panel.append(hd,el('div','gm-sit',d.sit));
  const slotBar=el('div','slots');d.slots.forEach(s=>slotBar.append(el('span','slot',s.k+' · '+s.n)));panel.append(slotBar);
  const area=el('div');area.style.display='grid';area.style.gap='10px';panel.append(area);
  if(d.time&&timersOn()){tl.textContent='Timed';panel.insertBefore(startTimer(d.time,()=>finish(true)),slotBar);}else tl.textContent='Take your time';
  const render=()=>{
    [...slotBar.children].forEach((c,i)=>c.className='slot'+(i<idx?' done':i===idx?' on':''));
    area.replaceChildren();const s=d.slots[idx];
    const lab=el('div','slot-label');lab.append(el('span','big',s.k),el('span','nm',s.n),el('span','hint',s.h));area.append(lab);
    const grid=el('div','opts');const opts=shuffle(s.o);
    opts.forEach((o,i)=>{const b=el('button','opt');b.type='button';b.append(el('kbd',null,String(i+1)),el('span',null,o.x));b.onclick=()=>pickOne(o);grid.append(b);});
    area.append(grid);
    keyHandler=e=>{const k=parseInt(e.key,10);if(k>=1&&k<=opts.length){e.preventDefault();pickOne(opts[k-1]);}};
  };
  const pickOne=o=>{if(finished)return;picks.push(o);idx++;if(idx>=d.slots.length)finish(false);else render();};
  const finish=timedOut=>{
    if(finished)return;finished=true;if(timerId){cancelAnimationFrame(timerId);timerId=null;}
    while(picks.length<d.slots.length)picks.push({x:'(Out of time)',q:0,w:'The clock ran out before you got here.',out:1});
    const pts=picks.reduce((a,p)=>a+p.q,0),max=d.slots.length*2,frac=pts/max;
    S.g[d.id]=frac;S.picks[d.id]=picks.filter(p=>!p.out).map(p=>p.x);
    const gain=frac>=.85?3:frac>=.6?2:frac>=.35?1:0;S.v[d.skill]+=gain;
    S.log.push({ch:S.ch,q:d.title,a:'Scored '+pts+' of '+max,fx:gain?{[d.skill]:gain}:{}});
    const said=S.picks[d.id].join(' ');
    if(n.say&&said)addLine({s:'you',x:said});
    clearPanel();
    const h=el('div','gm-head');h.append(el('div','gm-title',d.title+(timedOut?' · time ran out':'')));
    const sc=el('span','scoretxt');sc.append(document.createTextNode('Score '),el('b',null,pts+' / '+max));h.append(sc);panel.append(h);
    const fb=el('div','fb');
    picks.forEach((p,i)=>{const r=el('div','fb-row');r.append(el('span','k',d.slots[i].k));const c=el('div');
      const a=el('div');a.append(el('span','dot q'+p.q),document.createTextNode(p.x));c.append(a,el('div','w',p.w||''));r.append(c);fb.append(r);});
    panel.append(fb);
    if(gain)toast(null,'+'+gain+' '+SKILLS[d.skill]);
    const b=el('button','cont','Continue');b.type='button';b.onclick=()=>step();panel.append(b);
    keyHandler=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();step();}};
  };
  render();
}

/* ---------- mirror minigame ---------- */
function gameMirror(n){
  if(typing)typing.fin();
  const d=n.data;let r=0,score=0;
  const runRound=()=>{
    clearPanel();const R=d.rounds[r];
    const hd=el('div','gm-head');hd.append(el('div','gm-title',d.title+' · call '+(r+1)+' of '+d.rounds.length));hd.append(el('span','scoretxt','Correct '+score));panel.append(hd);
    if(r===0)panel.append(el('div','gm-sit',d.sit));
    const card=el('div','callcard');card.textContent='Theo: "'+R.call+'"';panel.append(card);
    const status=el('div','scoretxt','Listen...');panel.append(status);
    setTalk('theo');showDlg('theo',R.call);
    const pingT=setTimeout(()=>{card.append(el('div','ping',R.ping));},1300);
    const showFor=d.show*1000*(SET.timer==='relaxed'?2:SET.timer==='off'?2.4:1);
    setTimeout(()=>{clearTimeout(pingT);if(typing)typing.fin();card.className='callcard gone';card.textContent='The call is gone. What did you hear?';dlg.hidden=true;setTalk(null);status.textContent='Pick your mirror and check';ask(R);},showFor);
  };
  const ask=R=>{
    let done=false;const opts=shuffle(R.o);const grid=el('div','opts');
    const answer=o=>{if(done)return;done=true;if(timerId){cancelAnimationFrame(timerId);timerId=null;}
      [...grid.children].forEach((b,i)=>{b.disabled=true;const oo=opts[i];if(oo===o)b.classList.add('q'+o.q);else if(oo.q===2)b.classList.add('q2');else b.classList.add('dim');});
      addLine({s:'you',x:o?o.x:'(You missed it)'},true);
      if(o&&o.q===2){score++;addLine({s:'theo',x:'Yes. Exactly.'});}
      else{addLine({s:'theo',x:'No. I said: "'+R.call+'"'});if(o&&o.w)panel.append(el('div','gm-sit',o.w));}
      const b=el('button','cont',r<d.rounds.length-1?'Next call':'Finish drill');b.type='button';
      b.onclick=()=>{if(typing)typing.fin();r++;if(r<d.rounds.length)runRound();else end();};panel.append(b);
      keyHandler=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();b.click();}};
    };
    if(timersOn())panel.insertBefore(startTimer(d.time,()=>answer(null)),panel.lastChild);
    opts.forEach((o,i)=>{const b=el('button','opt');b.type='button';b.append(el('kbd',null,String(i+1)),el('span',null,o.x));b.onclick=()=>answer(o);grid.append(b);});
    panel.append(grid);
    keyHandler=e=>{const k=parseInt(e.key,10);if(k>=1&&k<=opts.length){e.preventDefault();answer(opts[k-1]);}};
  };
  const end=()=>{
    S.g[d.id]=score/d.rounds.length;
    const gain=score>=3?3:score===2?2:score===1?1:0;S.v[d.skill]+=gain;
    S.log.push({ch:S.ch,q:d.title,a:'Mirrored '+score+' of '+d.rounds.length+' calls correctly',fx:gain?{[d.skill]:gain}:{}});
    if(gain)toast(null,'+'+gain+' '+SKILLS[d.skill]);
    step();
  };
  runRound();
}

  w.append(g);
  ov.append(w);ov.hidden=false;ov.scrollTop=0;
}
