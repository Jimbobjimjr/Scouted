<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scouted</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-screen game. HUD strip on top, comms transcript in the middle, action panel at the bottom. Single dark Valor look. */
:root{
  color-scheme:dark;
  --bg:#080d22; --panel:#10183a; --panel2:#17214b; --line:#26326b; --line2:#334190;
  --text:#ecefff; --muted:#9ba5d6; --dim:#6a74a8;
  --blue:#3f8cff; --violet:#8b5cff; --violet2:#b49bff;
  --good:#38d39f; --warn:#ffb648; --bad:#ff6b7d;
  --display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5;overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:
   radial-gradient(1200px 600px at 50% -10%, rgba(139,92,255,.18), transparent 60%),
   radial-gradient(900px 500px at 100% 110%, rgba(63,140,255,.12), transparent 60%),
   linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px) 0 0/100% 32px,
   linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px) 0 0/32px 100%;}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--violet2);outline-offset:2px}
#app{position:relative;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}

/* HUD */
.hud{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:rgba(8,13,34,.85);backdrop-filter:blur(6px);flex-wrap:wrap}
.hud .ch{font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px}
.hud .place{display:flex;align-items:center;gap:8px;min-width:0;flex:1;font-size:13px;color:var(--muted)}
.hud .place b{color:var(--text);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mode{font-family:var(--mono);font-size:11px;letter-spacing:.08em;padding:3px 8px;border-radius:4px;border:1px solid var(--line2);white-space:nowrap;text-transform:uppercase}
.mode.voice{border-color:var(--violet);color:var(--violet2)}
.mode.voice::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bad);margin-right:6px;vertical-align:1px;animation:blink 1.4s infinite}
.mode.chat{border-color:var(--blue);color:#9cc3ff}
@keyframes blink{50%{opacity:.25}}
.tag{font-family:var(--mono);font-size:11px;padding:3px 7px;border-radius:4px;letter-spacing:.04em;white-space:nowrap}
.tag.k{background:rgba(63,140,255,.16);color:#a9c9ff;border:1px solid rgba(63,140,255,.5)}
.tag.t{background:rgba(139,92,255,.18);color:var(--violet2);border:1px solid rgba(139,92,255,.55)}
.hbtn{background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:5px 10px;font-size:13px;cursor:pointer}
.hbtn:hover{border-color:var(--violet)}

/* transcript */
.log{overflow-y:auto;padding-block:20px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));scroll-behavior:smooth}
.log-in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.ln{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start;animation:rise .28s ease-out both}
.ln .av{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:14px;color:#0b1026}
.ln .who{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.05em;text-transform:uppercase;display:flex;gap:8px;align-items:baseline}
.ln .who small{font-family:var(--body);text-transform:none;letter-spacing:0;color:var(--dim);font-weight:400;font-size:12px}
.ln .tx{min-width:0;font-size:17px}
.ln.voice .tx{font-size:17px}
.ln.voice .who::after{content:"";width:22px;height:10px;background:repeating-linear-gradient(90deg,currentColor 0 2px,transparent 2px 5px);opacity:.6;mask:linear-gradient(transparent 30%,#000 30% 70%,transparent 70%);align-self:center}
.ln.chat .tx{background:var(--panel2);border:1px solid var(--line);padding:8px 12px;border-radius:4px 14px 14px 14px;justify-self:start;max-width:min(560px,100%)}
.ln.sys{display:block;color:var(--muted);font-style:italic;padding:2px 0 2px 52px}
.ln.sys.tut{font-style:normal;color:var(--violet2);font-family:var(--mono);font-size:13px;border:1px dashed rgba(139,92,255,.5);border-radius:8px;padding:8px 12px;margin-left:52px}
.ln.you{display:flex;justify-content:flex-end}
.ln.you .tx{background:linear-gradient(135deg,var(--violet),#6a45e6);color:#fff;padding:9px 14px;border-radius:14px 4px 14px 14px;max-width:min(560px,92%)}
.ln.you.silent .tx{background:transparent;border:1px dashed var(--line2);color:var(--muted);font-style:italic}
.scene-break{display:flex;align-items:center;gap:12px;color:var(--dim);font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin:10px 0 2px;animation:rise .3s both}
.scene-break::before,.scene-break::after{content:"";flex:1;height:1px;background:var(--line)}
@keyframes rise{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* bottom panel */
.panel{border-top:1px solid var(--line);background:rgba(13,20,50,.96);padding-block:14px calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel-in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.cont{align-self:stretch;background:transparent;border:1px solid var(--line2);border-radius:10px;padding:12px;cursor:pointer;font-family:var(--mono);font-size:13px;color:var(--muted);letter-spacing:.06em}
.cont:hover{border-color:var(--violet);color:var(--text)}
.q{font-family:var(--display);font-weight:600;font-size:15px;color:var(--violet2);letter-spacing:.03em}
.timer{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--violet),var(--blue));transform-origin:left}
.timer.low i{background:var(--bad)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:620px){.opts{grid-template-columns:1fr}}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:11px 12px;cursor:pointer;font-size:15px;line-height:1.35;transition:border-color .15s,transform .1s}
.opt:hover{border-color:var(--violet);transform:translateY(-1px)}
.opt kbd{font-family:var(--mono);font-size:11px;background:var(--bg);border:1px solid var(--line2);border-radius:4px;padding:1px 6px;color:var(--muted);margin-top:1px}
.opt.pick{border-color:var(--violet2);background:rgba(139,92,255,.2)}
.opt.q2{border-color:var(--good)} .opt.q1{border-color:var(--warn)} .opt.q0{border-color:var(--bad)}
.opt[disabled]{cursor:default;transform:none}
.opt.dim{opacity:.45}

/* minigame */
.gm-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.gm-title{font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:14px}
.gm-sit{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;color:var(--muted)}
.slots{display:flex;gap:6px;flex-wrap:wrap}
.slot{font-family:var(--mono);font-size:12px;padding:5px 9px;border-radius:6px;border:1px solid var(--line2);color:var(--dim)}
.slot.on{border-color:var(--violet);color:var(--violet2);background:rgba(139,92,255,.14)}
.slot.done{border-color:var(--good);color:var(--good)}
.slot-label{display:flex;gap:10px;align-items:baseline}
.slot-label .big{font-family:var(--display);font-size:26px;font-weight:700;color:var(--violet2);line-height:1}
.slot-label .nm{font-family:var(--display);font-weight:600;font-size:16px}
.slot-label .hint{color:var(--muted);font-size:14px}
.fb{display:flex;flex-direction:column;gap:8px;max-height:38vh;overflow-y:auto}
.fb-row{display:grid;grid-template-columns:auto 1fr;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px}
.fb-row .k{font-family:var(--display);font-weight:700;color:var(--violet2);min-width:22px}
.fb-row .w{color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.dot.q2{background:var(--good)}.dot.q1{background:var(--warn)}.dot.q0{background:var(--bad)}
.score{font-family:var(--mono);font-size:13px;color:var(--muted)}
.score b{color:var(--text);font-size:16px}
.callcard{position:relative;background:linear-gradient(135deg,rgba(61,214,176,.12),rgba(139,92,255,.12));border:1px solid rgba(61,214,176,.6);border-radius:12px;padding:16px;font-size:20px;font-family:var(--display);font-weight:600;text-align:center;min-height:84px;display:grid;place-items:center}
.callcard.gone{color:var(--dim);font-family:var(--mono);font-size:13px;font-weight:500;border-style:dashed}
.ping{position:absolute;right:10px;top:-14px;background:var(--warn);color:#1a1300;font-family:var(--body);font-size:13px;font-weight:700;padding:5px 10px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.4);animation:shake .5s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* toasts */
.toasts{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:40;pointer-events:none;width:min(420px,calc(100% - 32px))}
.toast{display:flex;align-items:center;gap:10px;background:rgba(16,24,58,.97);border:1px solid var(--line2);border-left:4px solid var(--violet);border-radius:10px;padding:10px 14px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.45);animation:tin .35s ease-out both}
.toast .av{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:11px;color:#0b1026;flex:none}
.toast.out{animation:tout .4s ease-in forwards}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}
@keyframes tout{to{opacity:0;transform:translateY(-10px)}}

/* overlays */
.ov{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ov-in{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.title-wrap{min-height:100%;display:flex;flex-direction:column;justify-content:center}
.brand{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--violet2);text-transform:uppercase}
h1.logo{font-family:var(--display);font-weight:700;font-size:clamp(56px,13vw,120px);line-height:.9;letter-spacing:.02em;margin:6px 0 0;text-transform:uppercase;background:linear-gradient(180deg,#fff 30%,var(--violet2));-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{font-size:18px;color:var(--muted);max-width:60ch;margin:0}
.lede b{color:var(--text)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{background:linear-gradient(135deg,var(--violet),#6a45e6);border:0;border-radius:10px;padding:12px 20px;font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--text)}
.btn.ghost:hover{border-color:var(--violet)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.field input{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:11px 14px;font:inherit;font-size:18px;color:var(--text);width:min(320px,100%)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;padding:7px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--violet);color:#fff}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.chcard{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.chcard:hover{border-color:var(--violet)}
.chcard .n{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.chcard .ttl{font-family:var(--display);font-weight:700;font-size:17px}
.chcard .s{font-size:13px;color:var(--muted)}
.sec-h{font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:14px;color:var(--muted);margin:0}
.toolcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.tc{border-radius:14px;padding:16px;border:1px solid;display:flex;flex-direction:column;gap:10px}
.tc.k{border-color:rgba(63,140,255,.6);background:linear-gradient(160deg,rgba(63,140,255,.16),rgba(63,140,255,.04))}
.tc.t{border-color:rgba(139,92,255,.65);background:linear-gradient(160deg,rgba(139,92,255,.2),rgba(139,92,255,.04))}
.tc .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.tc.k .lbl{color:#a9c9ff}.tc.t .lbl{color:var(--violet2)}
.tc h3{font-family:var(--display);font-size:22px;margin:0;line-height:1.1;text-wrap:balance}
.tc p{margin:0;color:var(--muted);font-size:15px}
.steps{display:flex;flex-direction:column;gap:6px}
.steps div{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:baseline;font-size:15px}
.steps b{font-family:var(--display);font-size:20px;color:var(--violet2)}
.steps span em{color:var(--muted);font-style:normal}
.picks{display:flex;flex-direction:column;gap:8px}
.pick{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.pick .a{font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--line2);color:var(--muted)}
.chip.up{border-color:rgba(56,211,159,.6);color:var(--good)}
.chip.dn{border-color:rgba(255,107,125,.6);color:var(--bad)}
.reflect{border:1px dashed var(--line2);border-radius:12px;padding:14px 16px}
.reflect p{margin:6px 0 0;font-size:17px}
.bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.bar{display:flex;flex-direction:column;gap:5px}
.bar .top{display:flex;justify-content:space-between;font-size:14px}
.bar .top span:last-child{font-family:var(--mono);color:var(--muted);font-size:12px}
.bar .tr{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:4px}
.relgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.rel{display:grid;grid-template-columns:42px 1fr;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.rel .av{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#0b1026}
.rel .nm{font-family:var(--display);font-weight:600}
.rel .st{font-size:13px;color:var(--muted)}
.pips{display:flex;gap:3px;margin-top:4px}
.pips i{width:14px;height:5px;border-radius:2px;background:var(--panel2)}
.pips i.on{background:var(--violet2)}
.pips i.neg{background:var(--bad)}
.ending h2.end-t{font-family:var(--display);font-size:clamp(34px,7vw,56px);line-height:1;margin:4px 0 0;text-transform:uppercase}
.ending p{font-size:17px;margin:0;max-width:65ch}
.ending .ep{display:flex;flex-direction:column;gap:10px}
.notes table{width:100%;border-collapse:collapse;font-size:14px}
.notes th,.notes td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.notes th{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.tbl{overflow-x:auto}
.notes ul{margin:0;padding-left:20px;color:var(--muted)}
.notes li{margin:4px 0}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(380px,100%);z-index:35;background:var(--panel);border-left:1px solid var(--line2);padding-block:calc(18px + env(safe-area-inset-top,0px)) 18px;padding-left:18px;padding-right:max(18px,env(safe-area-inset-right,0px));overflow-y:auto;display:flex;flex-direction:column;gap:14px;box-shadow:-20px 0 40px rgba(0,0,0,.4)}
.drawer .rel{background:var(--panel2)}
@media (max-width:620px){#hudTags,.hud .place b{display:none}.hud{flex-wrap:nowrap;gap:8px}.hud .ch{font-size:12px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hud .place{flex:none}.gm-sit{font-size:14px;padding:8px 10px}.ln .tx{font-size:16px}.opt{font-size:14px;padding:9px 10px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.log{scroll-behavior:auto}}
</style>
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}</style>

<body>


<div id="app">
  <header class="hud">
    <span class="ch" id="hudCh">Scouted</span>
    <span id="hudTags" class="row" style="gap:6px"></span>
    <span class="place"><span class="mode" id="hudMode">room</span><b id="hudPlace"></b></span>
    <button class="hbtn" id="teamBtn" type="button">Team</button>
    <button class="hbtn" id="menuBtn" type="button">Menu</button>
  </header>
  <main class="log" id="log" aria-live="polite"><div class="log-in" id="logIn"></div></main>
  <footer class="panel"><div class="panel-in" id="panel"></div></footer>
</div>
<div class="toasts" id="toasts"></div>
<div class="ov" id="ov" hidden></div>
<div class="drawer" id="drawer" hidden></div>

<script>
/* ---------- cast ---------- */
const CAST={
  coach:{n:'Coach Raman',r:'Head coach',c:'#b49bff',i:'PR'},
  mako:{n:'Mako',r:'Captain, shot caller',c:'#5aa2ff',i:'MK'},
  jules:{n:'Jules',r:'Entry',c:'#ff8a7a',i:'JL'},
  theo:{n:'Theo',r:'Support',c:'#3dd6b0',i:'TH'},
  dee:{n:'Dee',r:'Best friend',c:'#f5c451',i:'DE'},
  sam:{n:'Sam',r:'Analyst',c:'#a9b4d6',i:'SM'},
  ryder:{n:'Ryder',r:'Blaze Syndicate',c:'#ff9f43',i:'RY'},
  host:{n:'Lou',r:'League stream host',c:'#c7d2fe',i:'LU'},
  opp:{n:'Northgate_Ace',r:'All chat',c:'#7d86b3',i:'NG'},
  rid:{n:'Ridgeline_Cap',r:'All chat',c:'#7d86b3',i:'RL'}
};
const RELS=['coach','mako','jules','theo','dee'];
const SKILLS={clear:'Clear Messaging',listen:'Listening',story:'Storytelling',calm:'Influence'};
const VALUES={positive:'Positive',purpose:'Purposeful',respect:'Respectful'};
const LABEL=k=>CAST[k]?CAST[k].n:(SKILLS[k]||VALUES[k]||k);

/* ---------- state ---------- */
const fresh=()=>({name:'Nova',ch:0,v:{coach:0,mako:0,jules:0,theo:0,dee:0,clear:0,listen:0,story:0,calm:0,positive:0,purpose:0,respect:0},f:{},g:{},log:[],picks:{}});
let S=fresh();
let SET={timer:'normal'};
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const savedSet=store.get('scouted.settings'); if(savedSet) SET=Object.assign(SET,savedSet);
const tmul=()=>SET.timer==='relaxed'?2:1;
const timersOn=()=>SET.timer!=='off';

/* ---------- script helpers ---------- */
const L=(s,x)=>({s,x});
const N=x=>({s:'sys',x});
const TUT=x=>({s:'sys',x,tut:1});

/* ---------- DOM ---------- */
const $=id=>document.getElementById(id);
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;};
const logIn=$('logIn'),logBox=$('log'),panel=$('panel');
let curMode='room';
function scrollDown(){requestAnimationFrame(()=>{logBox.scrollTop=logBox.scrollHeight;});}
function avatar(k,cls){const a=el('div',cls||'av',CAST[k].i);a.style.background=CAST[k].c;return a;}
function addLine(n){
  const x=nm(n.x);
  if(n.s==='sys'){const d=el('div','ln sys'+(n.tut?' tut':''),x);logIn.append(d);}
  else if(n.s==='you'){const d=el('div','ln you'+(n.silent?' silent':''));d.append(el('div','tx',x));logIn.append(d);}
  else{const c=CAST[n.s];const d=el('div','ln '+curMode);d.append(avatar(n.s));
    const b=el('div');b.style.minWidth='0';b.style.display='grid';b.style.gap='2px';
    const w=el('div','who');w.style.color=c.c;w.append(document.createTextNode(c.n));w.append(el('small',null,c.r));
    b.append(w,el('div','tx',x));d.append(b);logIn.append(d);}
  scrollDown();
}
function setScene(n){
  curMode=n.mode;const m=$('hudMode');m.className='mode '+n.mode;
  m.textContent=n.mode==='voice'?'Voice comms':n.mode==='chat'?'Messages':'In person';
  $('hudPlace').textContent=nm(n.place);
  if(logIn.children.length){logIn.append(el('div','scene-break',nm(n.place)));scrollDown();}
}
function setHud(chap){
  $('hudCh').textContent=chap.ch+' · '+chap.name;
  const t=$('hudTags');t.replaceChildren();chap.tags.forEach(([c,l])=>t.append(el('span','tag '+c,l+(c==='k'?' Knowledge':' Tool'))));
}
function toast(k,msg){const t=el('div','toast');t.style.borderLeftColor=CAST[k]?CAST[k].c:'var(--violet)';if(CAST[k])t.append(avatar(k,'av'));t.append(el('span',null,msg));
  const tb=$('toasts');while(tb.children.length>=3)tb.firstChild.remove();tb.append(t);setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),450);},3200);}

/* ---------- runner ---------- */
let Q=[],keyHandler=null,timerId=null;
function clearPanel(){panel.replaceChildren();keyHandler=null;if(timerId){cancelAnimationFrame(timerId);timerId=null;}}
function step(){
  clearPanel();
  if(!Q.length)return;
  const n=Q.shift();
  if(n.t==='scene'){setScene(n);return step();}
  if(n.s){addLine(n);return waitTap();}
  if(n.t==='choice')return showChoice(n);
  if(n.t==='if'){Q.unshift(...((n.c(S)?n.y:n.n)||[]));return step();}
  if(n.t==='dyn'){Q.unshift(...(n.f(S)||[]));return step();}
  if(n.t==='fx'){applyFx(n.fx,true);return step();}
  if(n.t==='do'){n.f(S);return step();}
  if(n.t==='game')return (n.kind==='mirror'?gameMirror:gameBuild)(n);
  if(n.t==='end')return showRecap();
  if(n.t==='final')return showFinal();
}
function waitTap(){
  const b=el('button','cont','Continue  ▸   (space)');b.type='button';b.onclick=()=>step();panel.append(b);
  keyHandler=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();step();}};
  b.focus({preventScroll:true});
}
function applyFx(fx,quiet){
  for(const k in fx){S.v[k]=(S.v[k]||0)+fx[k];}
  if(!quiet)return;
  const ups=Object.entries(fx).filter(([k,v])=>RELS.includes(k)&&v>0);
  ups.forEach(([k])=>toast(k,CAST[k].n+' liked that.'));
}
function startTimer(sec,onDone){
  const bar=el('div','timer');const i=el('i');bar.append(i);
  const total=sec*tmul()*1000;const t0=performance.now();
  const tick=now=>{const f=Math.max(0,1-(now-t0)/total);i.style.transform='scaleX('+f+')';bar.classList.toggle('low',f<.3);
    if(f<=0){timerId=null;onDone();return;} timerId=requestAnimationFrame(tick);};
  timerId=requestAnimationFrame(tick);return bar;
}
function showChoice(n){
  const timed=n.time>0&&timersOn();
  const head=el('div','gm-head');head.append(el('div','q',nm(n.q)));
  if(n.time>0) head.append(el('span','score',timed?'Timed':'Timer off'));
  panel.append(head);
  const to=n.to||O('(Say nothing)',{});
  let done=false;
  const pick=(o,silent)=>{if(done)return;done=true;
    const say=o.say?nm(o.say):nm(o.x);
    addLine({s:'you',x:say,silent:silent||/^\(.*\)$/.test(say)});
    applyFx(o.fx);
    S.log.push({ch:S.ch,q:nm(n.q),a:say,fx:o.fx});
    if(o.mem) toast(o.mem,CAST[o.mem].n+' will remember that.');
    Q.unshift(...(o.then||[]));
    step();
  };
  if(timed) panel.append(startTimer(n.time,()=>pick(to,true)));
  const grid=el('div','opts');
  n.o.forEach((o,i)=>{const b=el('button','opt');b.type='button';b.append(el('kbd',null,String(i+1)),el('span',null,nm(o.x)));b.onclick=()=>pick(o);grid.append(b);});
  panel.append(grid);
  keyHandler=e=>{const k=parseInt(e.key,10);if(k>=1&&k<=n.o.length){e.preventDefault();pick(n.o[k-1]);}};
}
document.addEventListener('keydown',e=>{if(!$('ov').hidden||!$('drawer').hidden)return;if(e.target.tagName==='INPUT')return;keyHandler&&keyHandler(e);});

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

/* builder minigame: SDV, Story, 3P, CALM */
function gameBuild(n){
  const d=n.data;const picks=[];let idx=0,finished=false;
  const head=el('div','gm-head');head.append(el('div','gm-title',d.title));
  const tl=el('span','score');head.append(tl);
  panel.append(head,el('div','gm-sit',d.sit));
  const slotBar=el('div','slots');d.slots.forEach(s=>slotBar.append(el('span','slot',s.k+' · '+s.n)));panel.append(slotBar);
  const area=el('div');area.style.display='grid';area.style.gap='10px';panel.append(area);
  if(d.time&&timersOn()){tl.textContent='Timed';panel.insertBefore(startTimer(d.time,()=>finish(true)),slotBar);}else tl.textContent='Take your time';
  const render=()=>{
    [...slotBar.children].forEach((c,i)=>c.className='slot'+(i<idx?' done':i===idx?' on':''));
    area.replaceChildren();
    const s=d.slots[idx];
    const lab=el('div','slot-label');lab.append(el('span','big',s.k),el('span','nm',s.n),el('span','hint',s.h));area.append(lab);
    const grid=el('div','opts');const opts=shuffle(s.o);
    opts.forEach((o,i)=>{const b=el('button','opt');b.type='button';b.append(el('kbd',null,String(i+1)),el('span',null,o.x));b.onclick=()=>choose(o);grid.append(b);});
    area.append(grid);
    keyHandler=e=>{const k=parseInt(e.key,10);if(k>=1&&k<=opts.length){e.preventDefault();choose(opts[k-1]);}};
  };
  const choose=o=>{if(finished)return;picks.push(o);idx++;if(idx>=d.slots.length)finish(false);else render();};
  const finish=timedOut=>{
    if(finished)return;finished=true;if(timerId){cancelAnimationFrame(timerId);timerId=null;}
    while(picks.length<d.slots.length)picks.push({x:'(Out of time)',q:0,w:'The clock ran out before you got here.'});
    const pts=picks.reduce((a,p)=>a+p.q,0),max=d.slots.length*2,frac=pts/max;
    S.g[d.id]=frac;S.picks[d.id]=picks.filter(p=>p.q>=0&&!/^\(Out/.test(p.x)).map(p=>p.x);
    const gain=frac>=.85?3:frac>=.6?2:frac>=.35?1:0;S.v[d.skill]+=gain;
    S.log.push({ch:S.ch,q:d.title,a:'Scored '+pts+' of '+max,fx:gain?{[d.skill]:gain}:{}});
    if(n.say){const said=picks.filter(p=>!/^\(Out/.test(p.x)).map(p=>p.x).join(' ');if(said)addLine({s:'you',x:said});}
    clearPanel();
    const h=el('div','gm-head');h.append(el('div','gm-title',d.title+(timedOut?' · time ran out':'')));
    const sc=el('span','score');sc.append(document.createTextNode('Score '),el('b',null,pts+' / '+max));h.append(sc);panel.append(h);
    const fb=el('div','fb');
    picks.forEach((p,i)=>{const r=el('div','fb-row');r.append(el('span','k',d.slots[i].k));const c=el('div');
      const a=el('div');a.append(el('span','dot q'+p.q),document.createTextNode(p.x));c.append(a,el('div','w',p.w||''));r.append(c);fb.append(r);});
    panel.append(fb);
    if(gain)toast(null,'+'+gain+' '+SKILLS[d.skill]);
    const b=el('button','cont','Continue  ▸');b.type='button';b.onclick=()=>step();panel.append(b);
    keyHandler=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();step();}};
  };
  render();
}

/* mirror minigame */
function gameMirror(n){
  const d=n.data;let r=0,score=0;
  const runRound=()=>{
    clearPanel();
    const R=d.rounds[r];
    const head=el('div','gm-head');head.append(el('div','gm-title',d.title+' · call '+(r+1)+' of '+d.rounds.length));
    head.append(el('span','score','Correct '+score));panel.append(head);
    if(r===0)panel.append(el('div','gm-sit',d.sit));
    const card=el('div','callcard');card.textContent='Theo: "'+R.call+'"';panel.append(card);
    const status=el('div','score','Listen...');panel.append(status);
    const pingT=setTimeout(()=>{const p=el('div','ping',R.ping);card.append(p);},1300);
    const showFor=d.show*1000*(SET.timer==='relaxed'?2:SET.timer==='off'?2.4:1);
    setTimeout(()=>{clearTimeout(pingT);card.className='callcard gone';card.textContent='The call is gone. What did you hear?';status.textContent='Pick your mirror and check';ask(R);},showFor);
  };
  const ask=R=>{
    let done=false;const opts=shuffle(R.o);
    const grid=el('div','opts');
    const answer=o=>{if(done)return;done=true;if(timerId){cancelAnimationFrame(timerId);timerId=null;}
      [...grid.children].forEach((b,i)=>{b.disabled=true;const oo=opts[i];if(oo===o)b.classList.add('q'+(o?o.q:0));else if(oo.q===2)b.classList.add('q2');else b.classList.add('dim');});
      if(o)addLine({s:'you',x:o.x});else addLine({s:'you',x:'(You missed it)',silent:true});
      if(o&&o.q===2){score++;addLine({s:'theo',x:'Yes. Exactly.'});}
      else{addLine({s:'theo',x:'No. I said: "'+R.call+'"'});if(o&&o.w)addLine({s:'sys',x:o.w});}
      const b=el('button','cont',r<d.rounds.length-1?'Next call  ▸':'Finish drill  ▸');b.type='button';
      b.onclick=()=>{r++;if(r<d.rounds.length)runRound();else end();};panel.append(b);
      keyHandler=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();b.click();}};
    };
    if(timersOn())panel.insertBefore(startTimer(d.time,()=>answer(null)),panel.lastChild);
    opts.forEach((o,i)=>{const b=el('button','opt');b.type='button';b.append(el('kbd',null,String(i+1)),el('span',null,o.x));b.onclick=()=>answer(o);grid.append(b);});
    panel.append(grid);
    keyHandler=e=>{const k=parseInt(e.key,10);if(k>=1&&k<=opts.length){e.preventDefault();answer(opts[k-1]);}};
  };
  const end=()=>{
    const frac=score/d.rounds.length;S.g[d.id]=frac;
    const gain=score>=3?3:score===2?2:score===1?1:0;S.v[d.skill]+=gain;
    S.log.push({ch:S.ch,q:d.title,a:'Mirrored '+score+' of '+d.rounds.length+' calls correctly',fx:gain?{[d.skill]:gain}:{}});
    if(gain)toast(null,'+'+gain+' '+SKILLS[d.skill]);
    step();
  };
  runRound();
}

/* ---------- chapter flow ---------- */
function startChapter(i,fromSave){
  S.ch=i;const chap=CHAPTERS[i];
  store.set('scouted.save',{S,at:i});
  logIn.replaceChildren();setHud(chap);
  $('ov').hidden=true;
  logIn.append(el('div','scene-break',chap.ch+' · '+chap.name));
  Q=chap.nodes.slice();step();
}
function chipsFor(fx){const w=el('div','chips');Object.entries(fx||{}).forEach(([k,v])=>{if(!v)return;w.append(el('span','chip '+(v>0?'up':'dn'),(v>0?'+':'')+v+' '+LABEL(k)));});return w;}
function cardEl(c){const d=el('div','tc '+c.c);d.append(el('div','lbl',c.lbl),el('h3',null,c.h),el('p',null,c.p));
  if(c.steps){const s=el('div','steps');c.steps.forEach(([k,h])=>{const r=el('div');r.append(el('b',null,k));const sp=el('span');sp.innerHTML=h;r.append(sp);s.append(r);});d.append(s);}return d;}
function showRecap(){
  clearPanel();
  const chap=CHAPTERS[S.ch],info=CARDS[chap.key];
  const ov=$('ov');ov.replaceChildren();const w=el('div','ov-in');
  w.append(el('div','brand',info.tag+' · complete'));
  const h=el('h1','logo',info.title);h.style.fontSize='clamp(40px,9vw,76px)';w.append(h);
  w.append(el('h2','sec-h','What you learned'));
  const tcs=el('div','toolcards');info.cards.forEach(c=>tcs.append(cardEl(c)));w.append(tcs);
  w.append(el('h2','sec-h','Your choices'));
  const pk=el('div','picks');
  S.log.filter(x=>x.ch===S.ch).forEach(x=>{const p=el('div','pick');p.append(el('div','score',x.q),el('div','a',x.a),chipsFor(x.fx));pk.append(p);});
  w.append(pk);
  const rf=el('div','reflect');rf.append(el('div','brand','Take it to your workbook'),el('p',null,info.reflect));w.append(rf);
  const row=el('div','row');
  const next=S.ch+1<CHAPTERS.length;
  const b=el('button','btn',next?'Next: '+CHAPTERS[S.ch+1].ch:'Finish');b.type='button';
  b.onclick=()=>{if(next)startChapter(S.ch+1);};
  const t=el('button','btn ghost','See team');t.type='button';t.onclick=openDrawer;
  row.append(b,t);w.append(row);
  ov.append(w);ov.hidden=false;ov.scrollTop=0;b.focus({preventScroll:true});
  store.set('scouted.save',{S,at:S.ch+1});
}
function relState(v){return v>=4?'Trusted':v>=2?'Friendly':v>=0?'Neutral':'Strained';}
function relEl(k){const v=S.v[k];const r=el('div','rel');r.append(avatar(k));const b=el('div');b.append(el('div','nm',CAST[k].n),el('div','st',CAST[k].r+' · '+relState(v)));
  const p=el('div','pips');for(let i=0;i<6;i++){const q=el('i');if(v>0&&i<v)q.className='on';if(v<0&&i<-v)q.className='neg';p.append(q);}b.append(p);r.append(b);return r;}
function barEl(label,v,max,color){const b=el('div','bar');const t=el('div','top');t.append(el('span',null,label),el('span',null,Math.max(0,v)+' pts'));
  const tr=el('div','tr');const i=el('i');i.style.width=Math.min(100,Math.max(0,v)/max*100)+'%';i.style.background=color;tr.append(i);b.append(t,tr);return b;}
function openDrawer(){
  const d=$('drawer');d.replaceChildren();
  const h=el('div','gm-head');h.append(el('div','gm-title','Your team'));const x=el('button','hbtn','Close');x.type='button';x.onclick=()=>{d.hidden=true;};h.append(x);d.append(h);
  d.append(el('div','score','How people feel about you right now.'));
  RELS.forEach(k=>d.append(relEl(k)));
  d.append(el('h2','sec-h','Comms skills'));
  Object.entries(SKILLS).forEach(([k,l])=>d.append(barEl(l,S.v[k],8,'linear-gradient(90deg,var(--blue),var(--violet))')));
  d.append(el('h2','sec-h','Valor values'));
  Object.entries(VALUES).forEach(([k,l])=>d.append(barEl(l,S.v[k],6,'var(--violet2)')));
  d.hidden=false;x.focus();
}
$('teamBtn').onclick=openDrawer;
$('menuBtn').onclick=()=>showTitle();
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('drawer').hidden=true;}});

function showFinal(){
  clearPanel();
  const s=S.v;const valSum=s.positive+s.purpose+s.respect;
  let title,lines=[];
  if(S.f.blaze){
    title='The Solo Act';
    lines=['You sign with Blaze Syndicate. The money is real, and so is the stream deal.',
     'But nobody plans practice, nobody reviews, and when a match goes badly, the team chat fills with blame. Three roster changes in six months.',
     'You still play well. You just miss being heard, and hearing others. In March, a message arrives from Coach Raman: "The door is still open."'];
  }else if(S.f.offer==='main'){
    title=S.f.won?'The Shot Caller':'The Captain in Waiting';
    lines=[S.f.won?'State champions, and next season you call for the Comets main roster.':'Second in the state, and next season you call for the Comets main roster.',
     'People follow you because you are calm, clear and sincere. Because you check, and you listen back.'];
  }else{
    title='The Teammate';
    lines=['Another season in the academy, now as deputy caller next to Mako.',
     'You have the tools now: State, Describe, Verify. Listen, Mirror, Check. Someone, Want, Obstacle, Change. CALM. Next season is about using them every time, not just when you remember.'];
  }
  if(S.f.honest)lines.push('Telling Coach Raman about the offer was the moment the club decided to build around you.');
  if(s.dee>=2)lines.push('Dee is in the crowd at your first match of next season, holding a sign with your handle spelled wrong. You keep it.');
  else if(s.dee<0)lines.push('You and Dee talk less these days. Maybe a message, this week, would be a good start.');
  if(s.theo>=4)lines.push('Theo becomes one of the best info callers in the league. In his first interview, he names you as the reason he kept talking.');
  else if(s.theo<0)lines.push('Theo moves to another academy at the end of the season. He never really said why.');
  if(s.jules>=2)lines.push('Jules still gets loud. But now, when you say "one voice", Jules is the first to go quiet.');
  if(valSum>=6)lines.push('At the season awards, the league gives you the Positive Player award, voted by the other teams.');

  const ov=$('ov');ov.replaceChildren();const w=el('div','ov-in ending');
  w.append(el('div','brand','Your career · Season one'));w.append(el('h2','end-t',title));
  const ep=el('div','ep');lines.forEach(l=>ep.append(el('p',null,nm(l))));w.append(ep);
  w.append(el('h2','sec-h','Your team'));const rg=el('div','relgrid');RELS.forEach(k=>rg.append(relEl(k)));w.append(rg);
  w.append(el('h2','sec-h','Your comms profile'));
  const bars=el('div','bars');Object.entries(SKILLS).forEach(([k,l])=>bars.append(barEl(l,s[k],8,'linear-gradient(90deg,var(--blue),var(--violet))')));
  Object.entries(VALUES).forEach(([k,l])=>bars.append(barEl(l,s[k],6,'var(--violet2)')));w.append(bars);
  const top=Object.entries(SKILLS).sort((a,b)=>s[b[0]]-s[a[0]]);
  const rf=el('div','reflect');rf.append(el('div','brand','Take it to your workbook'));
  rf.append(el('p',null,'Your strongest skill this run was '+top[0][1]+'. The one to work on is '+top[3][1]+'. Where could you practise it this week, in a game or in real life?'));w.append(rf);
  const row=el('div','row');const a=el('button','btn','Play again');a.type='button';a.onclick=()=>{store.set('scouted.save',null);showTitle();};
  const b=el('button','btn ghost','Pick a chapter');b.type='button';b.onclick=()=>showTitle();row.append(a,b);w.append(row);
  ov.append(w);ov.hidden=false;ov.scrollTop=0;
  store.set('scouted.save',null);
}

/* ---------- title / menu ---------- */
function showTitle(){
  clearPanel();
  const ov=$('ov');ov.replaceChildren();const w=el('div','ov-in title-wrap');
  w.append(el('div','brand','Valor Esports · Communication Skills Level 2'));
  w.append(el('h1','logo','Scouted'));
  const lede=el('p','lede');lede.innerHTML='You are a young player who just got scouted by an academy team. Every chat before, during and after a match shapes your career. <b>Choose what you say. People remember.</b>';w.append(lede);
  const f=el('div','field');const lb=el('label',null,'Your player handle');lb.htmlFor='handle';const inp=el('input');inp.id='handle';inp.maxLength=16;inp.value=S.name||'Nova';inp.autocomplete='off';f.append(lb,inp);w.append(f);
  const sv=store.get('scouted.save');
  const row=el('div','row');
  const go=el('button','btn','New career');go.type='button';
  go.onclick=()=>{const nmv=(inp.value||'').trim().slice(0,16)||'Nova';S=fresh();S.name=nmv;startChapter(0);};
  row.append(go);
  if(sv&&sv.S&&sv.at<CHAPTERS.length){const c=el('button','btn ghost','Continue: '+CHAPTERS[sv.at].ch+' · '+CHAPTERS[sv.at].name);c.type='button';
    c.onclick=()=>{S=Object.assign(fresh(),sv.S);startChapter(sv.at);};row.append(c);}
  const tn=el('button','btn ghost','For coaches');tn.type='button';tn.onclick=showNotes;row.append(tn);
  w.append(row);
  const st=el('div','row');st.append(el('span','score','Timers'));const seg=el('div','seg');
  [['normal','Normal'],['relaxed','Relaxed'],['off','Off']].forEach(([k,l])=>{const b=el('button',SET.timer===k?'on':'',l);b.type='button';b.onclick=()=>{SET.timer=k;store.set('scouted.settings',SET);[...seg.children].forEach(c=>c.className='');b.className='on';};seg.append(b);});
  st.append(seg);w.append(st);
  w.append(el('h2','sec-h','Jump to a chapter'));
  const g=el('div','chgrid');
  CHAPTERS.forEach((c,i)=>{const b=el('button','chcard');b.type='button';
    const tagrow=el('div','row');tagrow.style.gap='6px';tagrow.append(el('span','n',c.ch));c.tags.forEach(([k,l])=>tagrow.append(el('span','tag '+k,l)));
    b.append(tagrow,el('span','ttl',c.name),el('span','s',c.blurb));
    b.onclick=()=>{const nmv=(inp.value||'').trim().slice(0,16)||'Nova';S=fresh();S.name=nmv;startChapter(i);};g.append(b);});
  w.append(g);
  ov.append(w);ov.hidden=false;
}
function showNotes(){
  const ov=$('ov');ov.replaceChildren();const w=el('div','ov-in notes');
  w.append(el('div','brand','For coaches and teachers'));
  const h=el('h1','logo','Coach notes');h.style.fontSize='clamp(40px,9vw,72px)';w.append(h);
  w.append(el('p','lede','Scouted is a short narrative choice game built on the Communication Skills Level 2 course. Each chapter lines up with one module, so students can play a chapter after the matching lessons, or play it all in one go in about 30 to 40 minutes.'));
  const tw=el('div','tbl');const t=el('table');
  t.innerHTML='<thead><tr><th>Chapter</th><th>Weeks</th><th>What students practise</th></tr></thead><tbody>'+
   '<tr><td>Prologue: The Message</td><td>Any</td><td>Game time is training time. Balancing play with school and friends.</td></tr>'+
   '<tr><td>1: Clear Signal</td><td>1 and 2</td><td>Sender, message, receiver. Building a State, Describe, Verify call. Being a positive player in all chat.</td></tr>'+
   '<tr><td>2: Heard, Not Listened</td><td>3 and 4</td><td>Listening barriers. A Listen, Mirror, Check drill with distractions. Backing up a quiet teammate.</td></tr>'+
   '<tr><td>3: The Story We Tell</td><td>5 and 6</td><td>Set, Play, Review. Moving a team on from blame. Shaping Someone, Want, Obstacle, Change for a stream interview.</td></tr>'+
   '<tr><td>4: Calm Under Pressure</td><td>7 and 8</td><td>A 3P brief (Purpose, Plan, Point). A CALM reset in a tense final. A career choice.</td></tr></tbody>';
  tw.append(t);w.append(tw);
  w.append(el('h2','sec-h','How it plays'));
  const ul=el('ul');['Some replies are timed. If the bar runs out, the player says nothing, and that has consequences too. Set timers to Relaxed or Off on the title screen for students who need more time.',
   'Characters remember choices. A toast pops up when they do. Open the Team panel to see relationships, comms skills and Valor values.',
   'Each module has its own mini game: a call builder, a listening drill, a story builder, a 3P brief and a CALM reset. Every pick gets a short explanation.',
   'Each chapter ends with the matching knowledge and tool cards, a list of the player\'s choices, and a reflection question for the workbook.',
   'There are several endings. All of them are hopeful, but they reflect how the player treated people along the way.',
   'Progress saves in this browser only. Use "Jump to a chapter" to start any chapter fresh for a lesson.'].forEach(x=>ul.append(el('li',null,x)));
  w.append(ul);
  w.append(el('h2','sec-h','Discussion questions'));
  const ul2=el('ul');['Which choice was the hardest to make in time? What made it hard?','Did any character react in a way you did not expect? Why do you think they did?','Where did you see a message get lost, and what fixed it?','Pick one moment where staying silent mattered. Was silence the right call?','Which ending did you get? What would you do differently next run?'].forEach(x=>ul2.append(el('li',null,x)));
  w.append(ul2);
  const b=el('button','btn','Back');b.type='button';b.onclick=showTitle;const r=el('div','row');r.append(b);w.append(r);
  ov.append(w);ov.scrollTop=0;
}
showTitle();
</script>
